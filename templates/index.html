<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.0/css/bootstrap.min.css">
    <style>
        body {
            background: #f5e6e8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 35px 35px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-align: center;
        }
        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #2d1b2e;
            margin-bottom: 4px;
        }
        .subtitle {
            color: #a8888c;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .highest-bid-box {
            background: #fdf6f7;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 28px;
            border: 1px solid #f5e6e8;
        }
        .label {
            font-size: 12px;
            font-weight: 600;
            color: #b8969b;
            text-transform: uppercase;
            display: block;
        }
        .amount {
            font-size: 34px;
            font-weight: 800;
            color: #2d1b2e;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            font-size: 13px;
            font-weight: 600;
            color: #4a343c;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1.5px solid #f0e2e4;
            border-radius: 12px;
            outline: none;
            background: #fcf9f9;
            color: #2d1b2e;
            box-sizing: border-box;
        }
        input:focus {
            border-color: #d4a0a8;
            background: white;
        }
        .btn-bid {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            background: #2d1b2e;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 4px;
            transition: background 0.2s;
        }
        .btn-bid:hover {
            background: #3f283f;
        }
        .success {
            margin-top: 20px;
            padding: 12px 16px;
            background: #f0f7f4;
            border-radius: 12px;
            border: 1px solid #d4e8df;
        }
        .success h4 {
            font-size: 14px;
            font-weight: 600;
            color: #3a7a5e;
            margin: 0;
        }
        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #c9b2b6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔨 Live Auction</h1>
        <div class="subtitle">Place your bid</div>

        <div class="highest-bid-box">
            <span class="label">🏆 Current Highest Bid</span>
            <div class="amount">${{ highest_bid }}</div>
        </div>

        <form action="/" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Your name...">
            </div>
            <div class="form-group">
                <label for="price">Price</label>
                <input type="text" id="price" name="price" placeholder="Enter amount...">
            </div>
            <button type="submit" class="btn-bid">Place Bid</button>
        </form>

        {% if bid_added %}
        <div class="success">
            <h4>Bid added successfully!</h4>
        </div>
        {% endif %}

        <div class="footer">real-time bidding</div>
    </div>
</body>
</html>
